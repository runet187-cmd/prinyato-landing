<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Freelancer Pipeline</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#D66F4F;
  --accent-dark:#B8573A;
  --text:#252525;
  --muted:#6E6E6E;
  --bg:#F0F0F0;
  --dots:#CCCCCC;
  --card:#FFFFFF;
  --line:#DADADA;
  --on-accent:#FFFFFF;
  --font:"Inter Display","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:16px;
  --max:1120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --text:#EDEDED;
    --muted:#A3A3A3;
    --bg:#1C1C1E;
    --dots:#3A3A3C;
    --card:#2A2A2A;
    --line:#3A3A3C;
    --accent:#E0805F;
    --accent-dark:#D66F4F;
    --on-accent:#1C1C1E;
  }
}
:root[data-theme="dark"]{
  --text:#EDEDED;--muted:#A3A3A3;--bg:#1C1C1E;--dots:#3A3A3C;--card:#2A2A2A;--line:#3A3A3C;--accent:#E0805F;--accent-dark:#D66F4F;--on-accent:#1C1C1E;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:17px;line-height:1.55;
  background-image:radial-gradient(var(--dots) 1px,transparent 1.2px);
  background-size:24px 24px;
  overflow-x:hidden;
}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 16px}
@media(min-width:600px){.wrap{padding:0 24px}}
@media(min-width:900px){.wrap{padding:0 32px}}
section{padding:48px 0}
@media(min-width:600px){section{padding:72px 0}}
@media(min-width:900px){section{padding:96px 0}}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:.02em;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:13px;color:var(--accent);margin:0 0 12px;text-transform:uppercase;letter-spacing:.08em}
h1,h2,h3{line-height:1.12;margin:0;letter-spacing:-.02em;font-weight:700;overflow-wrap:break-word}
h1{font-size:clamp(30px,5.2vw + 14px,64px);font-weight:800}
h2{font-size:clamp(24px,2.6vw + 14px,40px);margin-bottom:16px}
h3{font-size:clamp(17px,.6vw + 14px,19px);letter-spacing:-.01em}
p{margin:0;overflow-wrap:break-word}
.lead{font-size:clamp(17px,2.4vw,20px);color:var(--muted);max-width:60ch}
.section-head{margin-bottom:32px;max-width:720px}

/* header */
header.site{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;min-height:60px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;min-width:0;flex:1 1 0;min-height:44px}
.brand img{width:36px;height:36px;border-radius:50%;flex:none}
.brand span{font-size:14px;line-height:1.15;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:560px){.brand span{font-size:16px}}
.bar nav{display:flex;align-items:center;gap:4px;flex:none}
@media(min-width:420px){.bar nav{gap:8px}}
.link-price{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;text-decoration:none;padding:8px 8px;border-radius:8px}
@media(min-width:420px){.link-price{padding:8px 10px}}
.link-price:hover{color:var(--accent)}
.lang{font-family:var(--mono);font-size:13px;font-weight:500;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:44px;min-width:44px}
.lang:hover{border-color:var(--accent);color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent);font:600 17px/1.25 var(--font);text-decoration:none;padding:15px 28px;min-height:48px;border-radius:999px;border:0;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s;max-width:100%;text-align:center}
.btn:hover{background:var(--accent-dark);transform:translateY(-2px);box-shadow:0 10px 24px -10px var(--accent)}
.btn:focus-visible{outline-color:var(--text)}

/* hero */
.hero{padding-top:40px}
.hero-grid{display:grid;gap:32px;align-items:center}
.hero-grid>*{min-width:0}
@media(max-width:599px){.hero .btn{width:100%}}
@media(min-width:900px){.hero-grid{grid-template-columns:1.2fr .8fr;gap:56px}}
.hero h1{margin-bottom:20px}
.hero .lead{margin-bottom:28px}
.cmd{display:inline-flex;max-width:100%;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:24px;font-family:var(--mono);font-size:13px;overflow:hidden}
.cmd b{color:var(--accent);font-weight:500}
.cmd .typed{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cmd b,.caret{flex:none}
.caret{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero-note{margin-top:14px}
.mascot{justify-self:center;width:min(78%,380px);max-width:100%;border-radius:50%;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.mascot img{border-radius:50%;width:100%;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}

/* cards */
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
@media(min-width:600px){
  .grid.c3,.grid.c5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.c3>.card:last-child:nth-child(odd),.grid.c5>.card:last-child:nth-child(odd){grid-column:1/-1}
}
@media(min-width:900px){
  .grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.c3>.card:last-child:nth-child(odd){grid-column:auto}
  .grid.c5{grid-template-columns:repeat(6,minmax(0,1fr))}
  .grid.c5 .card,.grid.c5>.card:last-child:nth-child(odd){grid-column:span 2}
  .grid.c5 .card:nth-child(n+4){grid-column:span 3}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 16px 30px -18px rgba(0,0,0,.35)}
.card h3{margin-bottom:8px}
@media(min-width:600px){.card,.steps li{padding:24px}}
.card p{color:var(--muted);font-size:16px}
.card .mono{display:block;margin-bottom:12px;color:var(--accent);overflow-wrap:anywhere}

/* steps */
.steps{counter-reset:s;display:grid;gap:16px;padding:0;margin:0;list-style:none}
@media(min-width:900px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:relative;transition:transform .25s,border-color .25s}
.steps li:hover{transform:translateY(-4px);border-color:var(--accent)}
.steps .n{font-family:var(--mono);font-size:13px;color:var(--accent);display:block;margin-bottom:10px}
.steps h3{margin-bottom:8px}
.steps p{color:var(--muted);font-size:16px}
.steps .out{margin-top:14px;display:block;overflow-wrap:anywhere}

/* list */
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
@media(min-width:600px){.checks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.checks li{overflow-wrap:break-word}
.checks li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 16px 48px;position:relative;font-size:16px}
.checks li::before{content:"";position:absolute;left:18px;top:21px;width:14px;height:8px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.fine{margin-top:20px;max-width:70ch;font-size:15px;color:var(--muted)}

/* price */
.price-box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 20px;text-align:center;max-width:640px;margin:0 auto}
@media(min-width:600px){.price-box{padding:48px}}
.price-box .btn{max-width:100%}
.price-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:8px 16px;margin:20px 0 8px}
.price-now{font-size:clamp(48px,12vw,72px);font-weight:800;letter-spacing:-.03em;line-height:1}
.price-old{font-size:24px;color:var(--muted);text-decoration:line-through}
.badge{display:inline-block;font-family:var(--mono);font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:4px 12px;margin-bottom:24px}
.price-box ul{list-style:none;padding:0;margin:0 0 28px;color:var(--muted);font-size:16px}
.price-box .mono{display:block;margin-top:16px}

/* for whom */
.who h3{margin-bottom:10px}

/* faq */
.faq{max-width:760px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;transition:border-color .2s}
details:hover,details[open]{border-color:var(--accent)}
summary{cursor:pointer;list-style:none;padding:14px 48px 14px 20px;min-height:48px;display:flex;align-items:center;font-weight:600;position:relative;overflow-wrap:break-word}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:20px;top:50%;transform:translateY(-50%);font-family:var(--mono);color:var(--accent);font-size:20px}
details[open] summary::after{content:"−"}
details p{padding:0 20px 18px;color:var(--muted);font-size:16px}

/* footer */
footer{border-top:1px solid var(--line);padding:32px 0 48px}
.foot{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center}
.foot strong{font-weight:700}
.foot>*{min-width:0;overflow-wrap:anywhere}

/* motion */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}
.enter{animation:enter .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
  .card:hover,.steps li:hover,.btn:hover{transform:none}
}
</style>
</head>
<body>
<header class="site">
  <div class="wrap bar">
    <a class="brand" href="#top"><picture><source srcset="assets/mascot-3d-dark-1080.png" media="(prefers-color-scheme: dark)"><img src="assets/mascot-3d-light-1080.png" width="36" height="36" alt="" data-i18n-alt="logoAlt"></picture><span data-i18n="brand"></span></a>
    <nav aria-label="Main">
      <a class="link-price" href="#price" data-i18n="navPrice"></a>
      <button class="lang" id="lang" type="button" aria-label="Language"></button>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <div class="cmd enter" style="--d:.05s" aria-hidden="true"><b>$</b><span class="typed" id="typed"></span><span class="caret"></span></div>
        <h1 class="enter" style="--d:.15s" data-i18n="heroTitle"></h1>
        <p class="lead enter" style="--d:.3s" data-i18n="heroSub"></p>
        <div class="enter" style="--d:.45s"><a class="btn js-cta" data-i18n="cta" target="_blank" rel="noopener" href="#"></a></div>
        <p class="mono hero-note enter" style="--d:.55s" data-i18n="heroNote"></p>
      </div>
      <div class="mascot enter" style="--d:.3s">
        <picture><source srcset="assets/mascot-3d-dark-1080.png" media="(prefers-color-scheme: dark)"><img src="assets/mascot-3d-light-1080.png" width="1080" height="1080" alt="" data-i18n-alt="mascotAlt"></picture>
      </div>
    </div>
  </section>

  <section aria-labelledby="pain-h">
    <div class="wrap">
      <div class="section-head reveal"><p class="eyebrow" data-i18n="painEyebrow"></p><h2 id="pain-h" data-i18n="painTitle"></h2><p class="lead" data-i18n="painLead"></p></div>
      <div class="grid c3" id="pain"></div>
    </div>
  </section>

  <section aria-labelledby="in-h">
    <div class="wrap">
      <div class="section-head reveal"><p class="eyebrow" data-i18n="inEyebrow"></p><h2 id="in-h" data-i18n="inTitle"></h2><p class="lead" data-i18n="inLead"></p></div>
      <div class="grid c5" id="features"></div>
    </div>
  </section>

  <section aria-labelledby="how-h">
    <div class="wrap">
      <div class="section-head reveal"><p class="eyebrow" data-i18n="howEyebrow"></p><h2 id="how-h" data-i18n="howTitle"></h2><p class="lead" data-i18n="howLead"></p></div>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section aria-labelledby="get-h">
    <div class="wrap">
      <div class="section-head reveal"><p class="eyebrow" data-i18n="getEyebrow"></p><h2 id="get-h" data-i18n="getTitle"></h2></div>
      <ul class="checks reveal" id="get"></ul>
      <p class="fine reveal" data-i18n="getNote"></p>
    </div>
  </section>

  <section aria-labelledby="who-h">
    <div class="wrap">
      <div class="section-head reveal"><p class="eyebrow" data-i18n="whoEyebrow"></p><h2 id="who-h" data-i18n="whoTitle"></h2></div>
      <div class="grid c3 who" id="who"></div>
    </div>
  </section>

  <section id="price" aria-labelledby="price-h">
    <div class="wrap">
      <div class="price-box reveal">
        <p class="eyebrow" data-i18n="priceEyebrow"></p>
        <h2 id="price-h" data-i18n="priceTitle"></h2>
        <div class="price-row"><span class="price-now" data-i18n="priceNow"></span><span class="price-old" data-i18n="priceOld"></span></div>
        <span class="badge" data-i18n="priceBadge"></span>
        <ul id="priceList"></ul>
        <a class="btn js-cta" data-i18n="cta" target="_blank" rel="noopener" href="#"></a>
        <span class="mono" data-i18n="priceNote"></span>
      </div>
    </div>
  </section>

  <section aria-labelledby="faq-h">
    <div class="wrap">
      <div class="section-head reveal"><p class="eyebrow" data-i18n="faqEyebrow"></p><h2 id="faq-h" data-i18n="faqTitle"></h2></div>
      <div class="faq reveal" id="faq"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <span><strong data-i18n="brand"></strong> <span class="mono" data-i18n="footVersion"></span></span>
    <span class="mono"><span data-i18n="footAccount"></span> @prinyato.ai</span>
  </div>
</footer>

let lang = "ru";
try { const s = localStorage.getItem("lang"); if (s === "ru" || s === "en") lang = s; } catch (e) {}

const $ = (s) => document.querySelector(s);
function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const d = I18N[lang];
  document.documentElement.lang = d.htmlLang;
  document.title = d.pageTitle;
  $('meta[name="description"]').setAttribute("content", d.metaDesc);
  document.querySelectorAll("[data-i18n]").forEach(n => { n.textContent = d[n.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-alt]").forEach(n => { n.alt = d[n.dataset.i18nAlt]; });
  const btn = $("#lang"); btn.textContent = d.langBtn; btn.setAttribute("aria-label", d.langLabel);

  const fill = (sel, items, build) => { const box = $(sel); box.innerHTML = ""; items.forEach((it, i) => { const n = build(it, i); n.classList.add("reveal"); n.style.setProperty("--d", (i * 0.08) + "s"); box.appendChild(n); }); };
  fill("#pain", d.pain, x => el("article","card","<h3>"+esc(x.t)+"</h3><p>"+esc(x.p)+"</p>"));
  fill("#features", d.features, x => el("article","card",'<span class="mono">'+esc(x.m)+"</span><h3>"+esc(x.t)+"</h3><p>"+esc(x.p)+"</p>"));
  fill("#steps", d.steps, x => el("li","",'<span class="n">'+esc(x.n)+"</span><h3>"+esc(x.t)+"</h3><p>"+esc(x.p)+'</p><code class="mono out">→ '+esc(x.o)+"</code>"));
  fill("#who", d.who, x => el("article","card","<h3>"+esc(x.t)+"</h3><p>"+esc(x.p)+"</p>"));
  const g = $("#get"); g.innerHTML = ""; d.get.forEach(t => g.appendChild(el("li","",esc(t))));
  const pl = $("#priceList"); pl.innerHTML = ""; d.priceList.forEach(t => pl.appendChild(el("li","",esc(t))));
  const f = $("#faq"); f.innerHTML = ""; d.faq.forEach(x => f.appendChild(el("details","","<summary>"+esc(x.q)+"</summary><p>"+esc(x.a)+"</p>")));
  observe();
}

let io = null;
function observe(){
  const nodes = document.querySelectorAll(".reveal:not(.in)");
  if (!("IntersectionObserver" in window)) { nodes.forEach(n => n.classList.add("in")); return; }
  if (!io) io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:0.12, rootMargin:"0px 0px -5% 0px"});
  nodes.forEach(n => io.observe(n));
}

document.querySelectorAll(".js-cta").forEach(a => { a.href = PAYMENT_URL; });
$("#lang").addEventListener("click", () => {
  lang = lang === "ru" ? "en" : "ru";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render(); startTyping(true);
});

/* Typing effect: shows the three real commands of the kit, once on load. No stats. */
let typeTimer = null;
function startTyping(instant){
  const out = $("#typed"); const txt = I18N[lang].typed;
  clearTimeout(typeTimer);
  if (instant || matchMedia("(prefers-reduced-motion: reduce)").matches){ out.textContent = txt; return; }
  let i = 0; out.textContent = "";
  (function step(){ out.textContent = txt.slice(0, ++i); if (i < txt.length) typeTimer = setTimeout(step, 55); })();
}

render();
startTyping(false);
</script>
